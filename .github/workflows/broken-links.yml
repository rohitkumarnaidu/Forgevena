name: Broken links

on:
  pull_request:
    paths: ["**/*.md", "website/**", ".lychee.toml", ".github/workflows/broken-links.yml"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-docs.js
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml "**/*.md" "**/*.html"
          fail: true
