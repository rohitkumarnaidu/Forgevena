name: Changelog preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --unreleased --strip header
        env:
          OUTPUT: dist/CHANGELOG.generated.md
      - name: Verify generated release notes
        run: test -s dist/CHANGELOG.generated.md
      - uses: actions/upload-artifact@v7
        with:
          name: changelog-preview
          path: dist/CHANGELOG.generated.md
          if-no-files-found: error
