name: Automated Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed tag to verify or repair, for example v1.2.1
        required: false
        type: string
      publish:
        description: Update the GitHub Release and downloadable assets for release_tag
        required: false
        type: boolean
        default: false
      publish_packages:
        description: Also retry npm, GitHub Packages, and container publication
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: 22
  RELEASE_REF: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run release:verify
      - run: npm pack --dry-run

  artifacts:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: mkdir -p dist
      - name: Select changelog configuration
        id: changelog-config
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git show "${GITHUB_SHA}:cliff.toml" > .release-cliff.toml
            echo "path=.release-cliff.toml" >> "$GITHUB_OUTPUT"
          else
            echo "path=cliff.toml" >> "$GITHUB_OUTPUT"
          fi
      - uses: orhun/git-cliff-action@v4
        with:
          config: ${{ steps.changelog-config.outputs.path }}
          args: --latest --strip header
        env:
          OUTPUT: dist/RELEASE_NOTES.md
      - run: npm pack
      - run: npm run release:assets
      - run: npm run release:supply-chain
      - run: cp forgevena-*.tgz dist/
      - name: Capture release verification evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GENERATOR="scripts/generate-release-verification.js"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git show "${GITHUB_SHA}:scripts/generate-release-verification.js" > .release-verification-generator.mjs
            GENERATOR=".release-verification-generator.mjs"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > dist/release-jobs.json
          RELEASE_COMMIT="$(git rev-parse "${RELEASE_REF}^{commit}")"
          node "${GENERATOR}" \
            --jobs dist/release-jobs.json \
            --output dist \
            --release-ref "${RELEASE_REF}" \
            --commit "${RELEASE_COMMIT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}"
          cat dist/RELEASE_VERIFICATION.md >> dist/RELEASE_NOTES.md
          rm dist/release-jobs.json
      - name: Package downloadable release assets
        shell: bash
        run: |
          VERSION="${RELEASE_REF#v}"
          tar -czf "dist/forgevena-${VERSION}-homebrew.tar.gz" -C dist/homebrew .
          tar -czf "dist/forgevena-${VERSION}-winget.tar.gz" -C dist/winget .
          tar -czf "dist/forgevena-${VERSION}-chocolatey.tar.gz" -C dist/chocolatey .
          cp dist/supply-chain/sbom.cdx.json "dist/forgevena-${VERSION}-sbom.cdx.json"
          cp dist/supply-chain/provenance.intoto.jsonl "dist/forgevena-${VERSION}-provenance.intoto.jsonl"
          (
            cd dist
            find . -maxdepth 1 -type f ! -name RELEASE_SHA256SUMS -printf '%P\n' | sort | while read -r file; do
              sha256sum "$file"
            done
          ) > dist/RELEASE_SHA256SUMS
      - name: Verify release notes
        run: test -s dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: forgevena-release
          path: dist/
          if-no-files-found: error

  github-release:
    needs: artifacts
    if: startsWith(inputs.release_tag || github.ref_name, 'v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: forgevena-release
          path: dist
      - name: Select release channel
        id: channel
        shell: bash
        run: |
          if [[ "${RELEASE_REF}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.make_latest }}
          files: |
            dist/forgevena-*.tgz
            dist/forgevena-*-homebrew.tar.gz
            dist/forgevena-*-winget.tar.gz
            dist/forgevena-*-chocolatey.tar.gz
            dist/forgevena-*-sbom.cdx.json
            dist/forgevena-*-provenance.intoto.jsonl
            dist/release-verification.json
            dist/RELEASE_VERIFICATION.md
            dist/SHA256SUMS
            dist/RELEASE_SHA256SUMS
            dist/RELEASE_NOTES.md

  publish-npm:
    needs: github-release
    if: startsWith(inputs.release_tag || github.ref_name, 'v') && (github.event_name == 'push' || inputs.publish_packages)
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Publish npm package when absent
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${RELEASE_REF#v}"
          if npm view "forgevena@${VERSION}" version >/dev/null 2>&1; then
            echo "forgevena@${VERSION} already exists; skipping immutable npm publication."
            exit 0
          fi
          CHANNEL="latest"
          if [[ "${VERSION}" == *-* ]]; then CHANNEL="next"; fi
          npm publish --tag "${CHANNEL}" --provenance --access public

  publish-github-packages:
    needs: github-release
    if: startsWith(inputs.release_tag || github.ref_name, 'v') && (github.event_name == 'push' || inputs.publish_packages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm pkg set name=@rohitkumarnaidu/forgevena
      - name: Publish GitHub package when absent
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${RELEASE_REF#v}"
          if npm view "@rohitkumarnaidu/forgevena@${VERSION}" --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@rohitkumarnaidu/forgevena@${VERSION} already exists; skipping immutable publication."
            exit 0
          fi
          npm publish --ignore-scripts --registry https://npm.pkg.github.com

  publish-containers:
    needs: github-release
    if: startsWith(inputs.release_tag || github.ref_name, 'v') && (github.event_name == 'push' || inputs.publish_packages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Read package version
        id: package
        shell: bash
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select container registries
        id: registries
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          DOCKERHUB_ENABLED=false
          DOCKERHUB_IMAGE=""
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            DOCKERHUB_ENABLED=true
            DOCKERHUB_IMAGE="${DOCKERHUB_USERNAME}/forgevena"
          else
            echo "Docker Hub credentials are absent; publishing GHCR only." >&2
          fi
          {
            echo "dockerhub=${DOCKERHUB_ENABLED}"
            echo "images<<EOF"
            echo "ghcr.io/rohitkumarnaidu/forgevena"
            if [[ "${DOCKERHUB_ENABLED}" == "true" ]]; then echo "${DOCKERHUB_IMAGE}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: steps.registries.outputs.dockerhub == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=${{ steps.package.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.package.outputs.version, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
