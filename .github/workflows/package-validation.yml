name: Package Validation

on:
  pull_request:
    paths: ["package.json", "package-lock.json", "bin/**", "src/**", "scripts/**", "Dockerfile.cli", ".github/workflows/package-validation.yml"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-lifecycle:
    name: npm lifecycle on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pack current branch artifact
        run: npm pack --pack-destination "$RUNNER_TEMP"
        shell: bash
      - name: Install, migrate, rollback, offline-install, and uninstall
        shell: bash
        run: |
          TEMP_ROOT="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          TARBALL="$(ls "$TEMP_ROOT"/forgevena-*.tgz | head -n 1)"
          TEST_ROOT="$TEMP_ROOT/forgevena-lifecycle"
          WORKSPACE="$TEST_ROOT/workspace"
          OFFLINE_ROOT="$TEMP_ROOT/forgevena-offline"
          mkdir -p "$TEST_ROOT" "$WORKSPACE"

          npm install --ignore-scripts --prefix "$TEST_ROOT" forgevena@1.3.0
          node "$TEST_ROOT/node_modules/forgevena/bin/forgevena.js" version
          cd "$WORKSPACE"
          node "$TEST_ROOT/node_modules/forgevena/bin/forgevena.js" init --apply --structured

          npm install --ignore-scripts --prefix "$TEST_ROOT" "$TARBALL"
          node "$TEST_ROOT/node_modules/forgevena/bin/forgevena.js" version
          node "$TEST_ROOT/node_modules/forgevena/bin/forgevena.js" upgrade --apply --structured
          node "$TEST_ROOT/node_modules/forgevena/bin/forgevena.js" state validate --structured
          node "$TEST_ROOT/node_modules/forgevena/bin/forgevena.js" upgrade rollback --apply --yes --structured
          node "$TEST_ROOT/node_modules/forgevena/bin/forgevena.js" state validate --structured
          node "$TEST_ROOT/node_modules/forgevena/bin/forgevena.js" doctor --structured

          npm install --offline --ignore-scripts --prefix "$OFFLINE_ROOT" "$TARBALL"
          node "$OFFLINE_ROOT/node_modules/forgevena/bin/forgevena.js" version

          npm uninstall --prefix "$TEST_ROOT" forgevena
          test -f "$WORKSPACE/.ai-workspace/workspace.json"
          if test -e "$TEST_ROOT/node_modules/forgevena"; then
            echo "Forgevena package remains installed after uninstall." >&2
            exit 1
          fi

  standalone:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: node22-win-x64
            file: forgevena-win-x64.exe
          - runner: ubuntu-latest
            target: node22-linux-x64
            file: forgevena-linux-x64
          - runner: macos-15-intel
            target: node22-macos-x64
            file: forgevena-macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:standalone -- --target ${{ matrix.target }} --output dist/standalone/${{ matrix.file }}
      - name: Smoke-test standalone executable
        shell: bash
        run: |
          if [[ "${{ matrix.file }}" != *.exe ]]; then chmod +x "dist/standalone/${{ matrix.file }}"; fi
          "dist/standalone/${{ matrix.file }}" version | grep '"version"'
          "dist/standalone/${{ matrix.file }}" doctor --structured > standalone-doctor.json
          grep '"status"' standalone-doctor.json

  npm-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:verify
      - run: npm pack
      - name: Smoke-test archive
        shell: bash
        run: |
          mkdir smoke
          npm install --prefix smoke --ignore-scripts ./forgevena-*.tgz
          node smoke/node_modules/forgevena/bin/forgevena.js version
      - run: docker build -f Dockerfile.cli -t forgevena:ci .
      - run: docker run --rm forgevena:ci version
      - run: docker run --rm forgevena:ci doctor --structured
      - run: docker run --rm forgevena:ci help
      - name: Verify mounted workspace remains unchanged during dry run
        shell: bash
        run: |
          mkdir -p docker-workspace
          docker run --rm -v "$PWD/docker-workspace:/workspace" forgevena:ci doctor --structured
          test -z "$(find docker-workspace -mindepth 1 -print -quit)"
