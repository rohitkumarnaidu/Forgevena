name: Documentation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: npm ci --ignore-scripts
      - name: Validate implementation-to-documentation impact
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          CHANGE_ID="push-${GITHUB_SHA::12}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then CHANGE_ID="pr-${{ github.event.pull_request.number }}"; fi
          node scripts/documentation-impact.js \
            --base "$BASE" \
            --head "$GITHUB_SHA" \
            --checkpoint merge \
            --change-id "$CHANGE_ID" \
            --owner "${{ github.actor }}" \
            --output-dir dist/documentation-evidence \
            --check
      - name: Upload documentation synchronization evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/documentation-evidence
          if-no-files-found: error
      - run: node scripts/validate-docs.js
      - run: node scripts/extract-mermaid.js
      - name: Install Mermaid browser runtime
        run: npx --yes puppeteer browsers install chrome-headless-shell@148.0.7778.97
      - name: Validate Mermaid diagrams
        shell: bash
        run: for diagram in dist/mermaid/*.mmd; do npx --yes -p @mermaid-js/mermaid-cli@11.16.0 mmdc -p .github/puppeteer-ci.json -i "$diagram" -o "${diagram%.mmd}.svg"; done
      - uses: streetsidesoftware/cspell-action@v8
        with:
          files: "docs/**/*.md"
          config: cspell.json
          incremental_files_only: false
      - run: npm test
      - run: pip install -r website/requirements.txt
      - run: mkdocs build --strict --config-file website/mkdocs.yml
      - name: Verify search index and 404 page
        run: test -s dist/docs-site/search/search_index.json && test -s dist/docs-site/404.html && test -s dist/docs-site/versions.json
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: dist/docs-site
          if-no-files-found: error
