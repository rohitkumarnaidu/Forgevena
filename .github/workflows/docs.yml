name: Documentation CI

on:
  pull_request:
    paths: ["docs/**", "website/**", "scripts/validate-docs.js", ".github/workflows/docs*.yml", ".github/workflows/pages.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "scripts/validate-docs.js"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-docs.js
      - run: node scripts/extract-mermaid.js
      - name: Install Mermaid browser runtime
        run: npx --yes puppeteer browsers install chrome-headless-shell@148.0.7778.97
      - name: Validate Mermaid diagrams
        shell: bash
        run: for diagram in dist/mermaid/*.mmd; do npx --yes -p @mermaid-js/mermaid-cli@11.16.0 mmdc -p .github/puppeteer-ci.json -i "$diagram" -o "${diagram%.mmd}.svg"; done
      - uses: streetsidesoftware/cspell-action@v8
        with:
          files: "docs/**/*.md"
          config: cspell.json
          incremental_files_only: false
      - run: npm test
      - run: pip install -r website/requirements.txt
      - run: mkdocs build --strict --config-file website/mkdocs.yml
      - name: Verify search index and 404 page
        run: test -s dist/docs-site/search/search_index.json && test -s dist/docs-site/404.html && test -s dist/docs-site/versions.json
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: dist/docs-site
          if-no-files-found: error
