name: Bug report
description: Report a reproducible platform defect
body:
  - type: markdown
    attributes:
      value: Never include credentials or private data.
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
    validations:
      required: true
